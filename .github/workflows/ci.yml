name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (reference passes, every flawed solution is caught)
        run: python -m unittest -v tests.test_evalkit
      - name: Cases are reproducible from the build script
        run: |
          python scripts/build_cases.py
          git diff --exit-code tasks/
      - name: Reference end-to-end run
        run: python -m evalkit run --model reference --out /tmp/ref
